<h2>默认隐藏后，角色如何留下“可召回的存在感”？</h2>
<p class="subtitle">三种 Android 入口方向：都不在运势页常驻人物，只保留低打扰的召回线索。</p>

<div class="cards">

      <div style="width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e6c98b,#8a5bb5 55%,#29143f);box-shadow:0 0 24px #b98ce277;display:flex;align-items:center;justify-content:center;color:#fff5df;font-size:22px">✦</div>
    </div>
    <div class="card-body"><h3>A · 微光浮球</h3><p>右下角只留一个可点的“星火”图标，不显示人物、不抢内容；点开后进入完整角色卡。</p></div>
  </div>
  <div class="card" data-choice="tab" onclick="toggleSelect(this)">
