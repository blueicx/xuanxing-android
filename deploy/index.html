<!DOCTYPE html>
<html lang="zh-CN">

    body {
      background: radial-gradient(circle at 50% 0%, #1a1a2e 0%, var(--bg) 70%);

      text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .btn {

      color: #1a1a24; font-weight: 700; font-size: 17px; text-decoration: none;
      padding: 14px 32px; border-radius: 999px; margin: 8px 0;
      box-shadow: 0 4px 16px rgba(212,175,55,0.4);
