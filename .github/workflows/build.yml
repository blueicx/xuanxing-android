name: Build Debug APK

on:
  push:
    branches: [ "main", "codex/reading-expansion" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify dialogue contract
        run: node _dev/dialogue_contract_test.js

      - name: Verify dialogue relevance matrix contract
        run: node _dev/dialogue_relevance_contract_test.js

      - name: Verify authentic systems contract
        run: node _dev/authentic_systems_contract_test.js

      - name: Verify unified stage contract
        run: node _dev/unified_stage_contract_test.js

      - name: Verify action and life profile contract
        run: node _dev/action_profile_contract_test.js

      - name: Verify reading favorites contract
        run: node _dev/reading_favorites_contract_test.js

      - name: Verify X3 shell contract
        run: node _dev/xuanji_v14_shell_contract_test.js

      - name: Verify full expansion contract
        run: node _dev/full_expansion_contract_test.js

      - name: Verify isolated application recovery contract
        run: node _dev/application_recovery_contract_test.js

      - name: Verify offline region comparison contract
        run: node _dev/region_comparison_contract_test.js

      - name: Verify deepening delivery contract
        run: node _dev/deepening_delivery_contract_test.js

      - name: Build debug APK
        run: ./gradlew testDebugUnitTest lintDebug writeDebugApkManifest assembleDebugAndroidTest --no-daemon

      - name: Record build provenance
        run: |
          git rev-parse HEAD > app/build/outputs/apk/debug/source-commit.txt
          cp app/build/outputs/apk/debug/output-metadata.json app/build/outputs/apk/debug/build-metadata.json
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS

      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3-unit-and-lint-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xuanxing-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
            app/build/outputs/apk/debug/source-commit.txt
            app/build/outputs/apk/debug/build-metadata.json
            app/build/outputs/apk/debug/build-manifest.json
          retention-days: 30

  android-ui-tests:
    name: Compose UI tests (API 34)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM access
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm

      - name: Run instrumented UI tests on API 34
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew connectedDebugAndroidTest --no-daemon
            ./gradlew -PxuanjiRegression=true :app:assembleRegression :app:assembleRegressionAndroidTest --no-daemon
            XUANJI_ADB_PORT=5037 node _dev/isolated_application_recovery.js --auto

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x3-android-ui-test-results
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/androidTests/connected/**
            work/.dispatch-backup/20261014-application-recovery/**
          if-no-files-found: ignore
          retention-days: 14
